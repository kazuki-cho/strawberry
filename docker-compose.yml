version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: frontend-app
    working_dir: /app/project
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/project:/app/project:cached
      - /app/project/node_modules
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: backend-app
    working_dir: /app
    ports:
      - "5001:5000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: strawberry
      POSTGRES_PASSWORD: strawberry
      POSTGRES_DB: strawberry
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U strawberry -d strawberry"]
      interval: 5s
      timeout: 5s
      retries: 5
volumes:
  db-data:

